<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#eef2ff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1f3a" media="(prefers-color-scheme: dark)" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>MFVA Crew Center — Set Your Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --nav-h: 72px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --ease: cubic-bezier(.22,.61,.36,1);
      --brand: #2463ff;
      --brand-dark: #1d4fd1;
      --ink: #0b1220;
      --ink-soft: #4b5563;
      --bg-1: #e7edff;
      --bg-2: #f3f5ff;
      --field-bg: #eaf1ff;
      --field-border: #d7e4ff;
      --radius-card: 24px;
      --radius-field: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 100%;
    }

    body {
      font-family: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 85% -10%, #dce4ff 0%, transparent 60%),
        radial-gradient(900px 600px at -10% 110%, #e3ecff 0%, transparent 55%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
      position: relative;
      overflow-x: hidden;
    }

    a, button, input {
      touch-action: manipulation;
      -webkit-user-drag: none;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      margin: 0 auto 22px;
      max-width: 520px;
      width: 100%;
    }
    .auth-brand__name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .02em;
      color: #18223f;
      white-space: nowrap;
      text-align: center;
    }

    .auth-card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: var(--radius-card);
      box-shadow:
        0 18px 50px -20px rgba(30, 45, 95, .25),
        0 2px 10px -4px rgba(30, 45, 95, .08);
      padding: 44px clamp(24px, 5vw, 52px) 40px;
      position: relative;
    }

    .auth-card__eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--brand);
      margin-bottom: 10px;
    }
    .auth-card__title {
      font-size: clamp(30px, 5.2vw, 44px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -.01em;
      color: #0b1220;
      margin-bottom: 12px;
    }
    .auth-card__subtitle {
      font-size: clamp(16px, 2vw, 20px);
      color: var(--ink-soft);
      font-weight: 400;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .field { margin-bottom: 24px; }
    .field label {
      display: block;
      font-size: 16px;
      font-weight: 500;
      color: #1f2740;
      margin-bottom: 10px;
    }
    .field__control { position: relative; }
    .field input[type="password"],
    .field input[type="text"] {
      width: 100%;
      display: block;
      padding: 18px 58px 18px 18px;
      font-size: clamp(17px, 2.2vw, 20px);
      font-family: inherit;
      color: #0b1220;
      background: var(--field-bg);
      border: 2px solid var(--field-border);
      border-radius: var(--radius-field);
      outline: none;
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
      letter-spacing: .01em;
      -webkit-appearance: none;
      appearance: none;
    }
    .field input::placeholder { color: #99a3bd; }
    .field input:focus {
      border-color: var(--brand);
      background: #ffffff;
      box-shadow: 0 0 0 5px rgba(36, 99, 255, .15);
    }
    .field input[aria-invalid="true"] {
      border-color: #d94040;
      background: #fff5f5;
    }

    .field__toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #5b6586;
      transition: background .15s var(--ease), color .15s var(--ease);
    }
    .field__toggle:hover { background: rgba(36,99,255,.08); color: var(--brand); }
    .field__toggle svg { width: 20px; height: 20px; }

    .field__hint {
      font-size: 13.5px;
      color: var(--ink-soft);
      line-height: 1.55;
      margin-top: 10px;
    }

    .btn-primary {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 17px 22px;
      margin-top: 8px;
      background: var(--brand);
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .03em;
      border-radius: 14px;
      box-shadow: 0 10px 24px -14px rgba(36,99,255,.85);
      transition: transform .12s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
    }
    .btn-primary:hover {
      background: var(--brand-dark);
      box-shadow: 0 14px 30px -14px rgba(29,79,209,.9);
    }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { opacity: .6; }

    .flash {
      display: none;
      padding: 12px 14px;
      margin-bottom: 22px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
    }
    .flash.is-visible { display: block; }
    .flash--error   { background: #fff1f1; color: #8b1f1f; border: 1px solid #ffd0d0; }
    .flash--success { background: #ecf9ee; color: #1f6b2b; border: 1px solid #bfe8c5; }

    .auth-sub-note {
      text-align: center;
      max-width: 520px;
      margin: 18px auto 0;
      font-size: 12.5px;
      color: #7c86a3;
      line-height: 1.6;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main style="width:100%;">
    <div class="auth-brand">
      <span class="auth-brand__name">Xiamen Virtual Airlines</span>
    </div>
    <section class="auth-card">
      <div class="flash flash--error" id="flash" role="alert"></div>

      <p class="auth-card__eyebrow">MFVA Crew Center</p>
      <h1 class="auth-card__title">Set Your Password</h1>
      <p class="auth-card__subtitle">This is your first sign-in as CEO. Choose a password now — you'll use it for every future login.</p>

      <form id="setPwForm" novalidate>
        <div class="field">
          <label for="password">New Password</label>
          <div class="field__control">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Create a password"
              required
              minlength="4"
            />
            <button type="button" class="field__toggle" id="togglePw" aria-label="Show password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <p class="field__hint">At least 4 characters.</p>
        </div>

        <div class="field">
          <label for="password2">Confirm Password</label>
          <div class="field__control">
            <input
              id="password2"
              name="password2"
              type="password"
              autocomplete="new-password"
              placeholder="Re-enter password"
              required
              minlength="4"
            />
            <button type="button" class="field__toggle" id="togglePw2" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="btnSetPw">Set Password & Continue</button>
      </form>
    </section>

    <p class="auth-sub-note">
      Once set, your password is required for every sign-in. You can change it later from the Crew Center.
    </p>
  </main>

  <script src="auth.js?v=20260824-ceopasswordless"></script>
  <script>
    (function () {
      "use strict";

      var $ = function (id) { return document.getElementById(id); };
      var flash = $("flash");
      var form  = $("setPwForm");
      var pwInput  = $("password");
      var pw2Input = $("password2");
      var togglePw  = $("togglePw");
      var togglePw2 = $("togglePw2");
      var btn = $("btnSetPw");

      function showFlash(msg, isError) {
        if (!flash) return;
        flash.textContent = msg || "";
        flash.className = "flash " + (isError ? "flash--error" : "flash--success") + " is-visible";
      }
      function hideFlash() {
        if (!flash) return;
        flash.className = "flash flash--error";
        flash.textContent = "";
      }
      function mark(el, bad) {
        if (!el) return;
        if (bad) { el.setAttribute("aria-invalid", "true"); }
        else     { el.removeAttribute("aria-invalid"); }
      }

      // ---------- Guard: only the CEO on first login may use this page ----------
      if (!window.MFVAauth) {
        document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#b91c1c;">Authentication module failed to load. Return to <a href="index.html">Home</a>.</div>';
        return;
      }

      (function guard() {
        if (!MFVAauth.isSignedIn()) {
          window.location.replace("login.html");
          return;
        }
        var me = MFVAauth.currentUser();
        if (!me) {
          window.location.replace("login.html");
          return;
        }
        // Allow only when the CEO still needs to set a password.
        var needs = false;
        try { needs = MFVAauth.needsPasswordSetup(me.email); } catch (e) { needs = false; }
        if (!needs) {
          // Already set (or not the CEO) → go to crew center.
          window.location.replace("crew.html");
          return;
        }
      })();

      // ---------- Password show/hide toggles ----------
      function bindToggle(btn, input) {
        if (!btn || !input) return;
        btn.addEventListener("click", function () {
          var show = input.type === "password";
          input.type = show ? "text" : "password";
          btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
        });
      }
      bindToggle(togglePw, pwInput);
      bindToggle(togglePw2, pw2Input);

      // ---------- Submit ----------
      if (form) {
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          hideFlash();

          var pw  = pwInput.value;
          var pw2 = pw2Input.value;

          mark(pwInput, pw.length < 4);
          mark(pw2Input, pw !== pw2);

          if (pw.length < 4) { showFlash("Password must be at least 4 characters long.", true); pwInput.focus(); return; }
          if (pw !== pw2)    { showFlash("Passwords do not match.", true); pw2Input.focus(); return; }

          if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }

          try {
            var r = MFVAauth.setInitialPassword(pw);
            if (r && r.ok) {
              showFlash("Password set! Taking you to the Crew Center…", false);
              setTimeout(function () { window.location.replace("crew.html"); }, 700);
            } else {
              if (btn) { btn.disabled = false; btn.textContent = "Set Password & Continue"; }
              showFlash("Could not set password. Please try again.", true);
            }
          } catch (err) {
            if (btn) { btn.disabled = false; btn.textContent = "Set Password & Continue"; }
            var msg = (err && err.message) || "Failed.";
            if (msg === "NOT_SIGNED_IN") msg = "Your session expired. Please sign in again.";
            else if (msg === "NOT_ALLOWED") msg = "Only the CEO can set an initial password here.";
            else if (msg === "ALREADY_SET") msg = "A password is already set. Sign in with it instead.";
            else if (msg === "PASSWORD_TOO_SHORT") msg = "Password must be at least 4 characters long.";
            showFlash(msg, true);
          }
        });
      }
    })();
  </script>
</body>
</html>
